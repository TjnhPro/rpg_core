name: Core package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          # Modifier provenance tests hash the accepted pre-extraction sources.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run check:preservation
      - run: npm test
      - run: npm run example
      - run: npm run test:consumer
